name: Daily Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r pulse-saas/requirements.txt
        
      - name: Run Play Store Scraper
        run: python pulse-saas/scripts/scrape_reviews.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pulse-saas/api/data/live_playstore_reviews.csv
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of live play store reviews [skip ci]" && git push)
